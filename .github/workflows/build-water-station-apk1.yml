name: Build Water Station APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/WaterStation-V42-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterStation-V42-APK
          path: release/WaterStation-V42-debug.apk
          if-no-files-found: error
